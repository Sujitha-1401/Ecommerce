spring.application.name=Ecomerce

# Database Configuration (H2 embedded persistent database for local development)
spring.datasource.url=jdbc:h2:file:./data/ecommerce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3 defaults
aws.access.key=dummy_access_key
aws.secret.key=dummy_secret_key
aws.region=us-east-1
aws.s3.bucket.category=ecommerce-category
aws.s3.bucket.product=ecommerce-product
aws.s3.bucket.profile=ecommerce-profile

#spring.main.allow-circular-references=true

spring.mail.host=smtp.gmail.com
spring.mail.username=yourmail@gmail.com
spring.mail.password=*************
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

